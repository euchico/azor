<main class="auth-page">
  <section class="auth-card">
    <h1>Entrar</h1>
    <p>Entre para acessar a área privada do Azor.</p>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <label>
        E-mail
        <input type="email" formControlName="email" placeholder="seu@email.com" autocomplete="email" />
      </label>

      <label>
        Senha
        <input type="password" formControlName="password" placeholder="Sua senha" autocomplete="current-password" />
      </label>

      @if (errorMessage()) {
        <p class="error-message">{{ errorMessage() }}</p>
      }

      <button type="submit">Entrar</button>
    </form>

    <p>Não tem uma conta? <a routerLink="/register">Cadastre-se</a>.</p>
  </section>
</main>
