<main class="auth-page">
  <section class="auth-card">
    <h1>Criar conta</h1>
    <p>Crie sua conta usando e-mail e senha.</p>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <label>
        E-mail
        <input type="email" formControlName="email" placeholder="seu@email.com" autocomplete="email" />
      </label>

      <label>
        Senha
        <input type="password" formControlName="password" placeholder="Crie uma senha" autocomplete="new-password" />
      </label>

      <small>A senha deve ter 8 caracteres, uma letra maiúscula, uma minúscula e um número.</small>

      @if (errorMessage()) {
        <p class="error-message">{{ errorMessage() }}</p>
      }

      @if (successMessage()) {
        <p class="success-message">{{ successMessage() }}</p>
      }

      <button type="submit">Criar conta</button>
    </form>

    <p>Já tem uma conta? <a routerLink="/login">Entrar</a>.</p>
  </section>
</main>
